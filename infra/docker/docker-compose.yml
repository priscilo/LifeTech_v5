services:

  postgres:
    image: postgres:15
    container_name: lifetech-postgres
    restart: always
    environment:
      POSTGRES_USER: lifetech
      POSTGRES_PASSWORD: lifetech
      POSTGRES_DB: lifetech
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: lifetech-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: